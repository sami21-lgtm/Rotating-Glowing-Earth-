<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tilted Rotating Earth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="space">
        <!-- সূর্যের আলো -->
        <div class="sunlight"></div>
        
        <!-- গ্লোব কন্টেইনার (ছায়া ও গ্লো এর জন্য) -->
        <div class="earth-shadow">
            <!-- আসল পৃথিবীর ম্যাপ যা হেলে ঘুরবে -->
            <div class="earth-map" id="earth"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
